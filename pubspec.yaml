name: muc_digital
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.0

  firebase_core: ^3.15.2
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_database: ^11.0.1
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.0.0

  flutter_launcher_icons: ^0.14.1

  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  flutter_polyline_points: ^2.0.0


  google_fonts: ^8.0.2
  animate_do: ^4.2.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^2.0.1
  table_calendar: ^3.1.3


  intl: ^0.20.2
  http: ^1.6.0
  url_launcher: ^6.3.0
  provider: ^6.1.5+1


  intl_phone_number_input: ^0.7.5
  pin_code_fields: ^8.0.1


  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0


  image_picker: ^1.2.1
  cached_network_image: ^3.4.0


  flutter_local_notifications: ^17.0.0
  fluttertoast: ^8.2.8


  flutter_stripe: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/truck.png
    - assets/icons/dump_active.png
    - assets/icons/dump_closed.png
    - assets/icons/app_icon.jpeg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"   # Your app's green color
  adaptive_icon_foreground: "assets/icons/app_icon.png"